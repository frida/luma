name: QEMU

on:
  push:
    tags:
      - qemu-*
  pull_request:
    paths:
      - LumaGtk/scripts/windows/build-qemu.sh
      - .github/workflows/qemu.yml
  workflow_dispatch:

env:
  QEMU_VERSION: "11.1.0"

jobs:
  windows-x86_64:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ntldd

      - name: Resolve build name
        run: |
          case "$GITHUB_REF" in
          refs/tags/qemu-*)
            echo "QEMU_BUILD=${GITHUB_REF#refs/tags/qemu-}" >> "$GITHUB_ENV"
            ;;
          *)
            echo "QEMU_BUILD=$QEMU_VERSION-dev" >> "$GITHUB_ENV"
            ;;
          esac

      - name: Build QEMU
        run: |
          mkdir artifacts
          LumaGtk/scripts/windows/build-qemu.sh "$QEMU_VERSION" "$QEMU_BUILD" artifacts | tee artifacts.txt

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: qemu-${{ env.QEMU_BUILD }}-windows-x86_64.zip
          path: artifacts/qemu-${{ env.QEMU_BUILD }}-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/qemu-')
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts.txt
          files: artifacts/qemu-${{ env.QEMU_BUILD }}-windows-x86_64.zip
